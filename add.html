<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Shift</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f5f5f5}
.container{max-width:600px;margin:auto;padding:12px}
.card{background:white;padding:15px;border-radius:12px}

label{margin-top:10px;display:block}

/* GROUP 1 */
.group1 input{
  width:95%;
  padding:12px;
  margin-top:6px;
  border-radius:12px;
  border:1px solid #ccc;
  background:#f9f9f9;
  font-size:16px;
}

/* GROUP 2 */
.group2 input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:20px;
  border:1px solid #aaa;
  background:#fff;
  font-size:16px;
}

.group2 button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:20px;
  border:none;
  background:#4CAF50;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>
<div class="container">
<div class="card">
<h2>Add Shift</h2>

<div class="group1">
<label>Date</label>
<input type="date" id="date">

<label>From</label>
<input type="time" id="from">

<label>To</label>
<input type="time" id="to">
</div>

<div class="group2">
<label>Break Hours</label>
<input type="number" id="break" placeholder="e.g 1">

<button onclick="save()">Save</button>
<button onclick="location.href='index.html'">Back</button>
</div>

</div>
</div>

<script>
let data=JSON.parse(localStorage.getItem('shifts')||'{}');
let settings=JSON.parse(localStorage.getItem('settings')||'{"weekday":13,"weekend":14}');

function save(){
 let date=document.getElementById('date').value;
 let from=document.getElementById('from').value;
 let to=document.getElementById('to').value;
 let br=parseFloat(document.getElementById('break').value)||0;

 if(!date || !from || !to){
   alert('Please fill all fields');
   return;
 }

 let hours=(new Date(`1970-01-01T${to}`)-new Date(`1970-01-01T${from}`))/3600000;
 hours-=br;

 let day=new Date(date).getDay();
 let rate=(day===0||day===6)?settings.weekend:settings.weekday;
 let pay=hours*rate;

 data[date]={from,to,hours,pay,break:br};
 localStorage.setItem('shifts',JSON.stringify(data));

 window.location.href='index.html';
}
</script>
</body>
</html>
