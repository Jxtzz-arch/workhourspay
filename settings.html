<!-- ================= SETTINGS.HTML ================= -->
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f5f5f5}
.container{max-width:600px;margin:auto;padding:12px}
.card{background:white;padding:15px;border-radius:12px}
label{margin-top:10px;display:block}
input,button{width:100%;padding:12px;margin-top:6px;border-radius:12px;border:1px solid #ccc}
button{background:#4CAF50;color:white;border:none}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h2>Pay Settings</h2>

<label>Weekday ($/hr)</label>
<input type="number" id="weekday">

<label>Weekend ($/hr)</label>
<input type="number" id="weekend">

<button onclick="saveSettings()">Save</button>
<button onclick="location.href='index.html'">Back</button>
</div>
</div>

<script>
let settings=JSON.parse(localStorage.getItem('settings')||'{"weekday":13,"weekend":14}');
weekday.value=settings.weekday;
weekend.value=settings.weekend;

function saveSettings(){
 settings.weekday=parseFloat(weekday.value);
 settings.weekend=parseFloat(weekend.value);
 localStorage.setItem('settings',JSON.stringify(settings));
 alert('Saved');
}
</script>
</body>
</html>
