<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f5f5f5}

/* 🔥 HAMBURGER BUTTON */
.menu-btn{
  width:50px;
  height:50px;
  position:fixed;
  top:15px;
  left:15px;
  background:white;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:6px;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
  z-index:1001;
  cursor:pointer;
}

.menu-btn span{
  width:22px;
  height:3px;
  background:#333;
  border-radius:2px;
  transition:0.3s;
}

/* 🔥 ANIMATION TO X */
.menu-btn.active span:nth-child(1){
  transform:rotate(45deg) translate(5px,5px);
}
.menu-btn.active span:nth-child(2){
  opacity:0;
}
.menu-btn.active span:nth-child(3){
  transform:rotate(-45deg) translate(5px,-5px);
}

/* 🔥 SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  left:-260px;
  width:240px;
  height:100%;
  background:white;
  padding:20px;
  box-shadow:2px 0 10px rgba(0,0,0,0.2);
  transition:0.3s ease;
  z-index:1000;
}

.sidebar.open{
  left:0;
}

.sidebar button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  background:#4CAF50;
  color:white;
  font-size:16px;
}

/* 🔥 OVERLAY */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.3);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:998;
}

.overlay.show{
  opacity:1;
  pointer-events:auto;
}

.container{
  max-width:600px;
  margin:auto;
  padding:10px;
  margin-top:60px;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1)
}

.chart-container{height:200px}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px
}

.day{
  padding:10px;
  text-align:center;
  background:white;
  border-radius:8px;
  cursor:pointer;
}

h3{text-align:center}
</style>
</head>

<body>

<!-- 🍔 MENU BUTTON -->
<div class="menu-btn" onclick="toggleMenu()">
  <span></span>
  <span></span>
  <span></span>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h3>Menu</h3>
  <button onclick="location.href='settings.html'">⚙ Settings</button>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="container">

<h3 id="weekLabel"></h3>

<div class="card">
<h2>Weekly Graph</h2>
<div class="chart-container">
<canvas id="chart"></canvas>
</div>
</div>

<div class="card">
<h2>Calendar</h2>
<div id="calendar" class="calendar"></div>
</div>

<div class="card" id="details" style="display:none;"></div>

</div>

<script>
let data = JSON.parse(localStorage.getItem('shifts')||'{}');
let offset = 0;
let chart;

/* 🔥 MENU TOGGLE */
function toggleMenu(){
  document.querySelector('.menu-btn').classList.toggle('active');
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

// week calc
function getMonday(d){
 let date=new Date(d);
 let day=date.getDay();
 let diff=(day===0?-6:1-day);
 date.setDate(date.getDate()+diff+offset*7);
 return date;
}

// chart
function renderChart(){
 let monday=getMonday(new Date());
 let labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
 let hours=[],pay=[];

 for(let i=0;i<7;i++){
  let d=new Date(monday);
  d.setDate(monday.getDate()+i);
  let key=d.toISOString().split('T')[0];

  hours.push(data[key]?.hours||0);
  pay.push(data[key]?.pay||0);
 }

 document.getElementById('weekLabel').innerText=monday.toDateString();

 if(chart) chart.destroy();
 chart=new Chart(document.getElementById('chart'),{
  type:'bar',
  data:{labels,datasets:[
    {label:'Hours',data:hours},
    {label:'Pay ($)',data:pay}
  ]},
  options:{responsive:true,maintainAspectRatio:false}
 });
}

// swipe
let startX=0;
document.addEventListener('touchstart',e=>startX=e.touches[0].clientX);
document.addEventListener('touchend',e=>{
 let diff=startX-e.changedTouches[0].clientX;
 if(Math.abs(diff)>50){
  if(diff>0){offset--;}
  else if(offset<0){offset++;}
  renderChart();
 }
});

// calendar
function renderCalendar(){
 let cal=document.getElementById('calendar');
 cal.innerHTML='';

 let today=new Date();
 let year=today.getFullYear();
 let month=today.getMonth();

 let firstDay=new Date(year,month,1).getDay();
 let days=new Date(year,month+1,0).getDate();

 let daysOfWeek=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
 daysOfWeek.forEach(d=>{
  let div=document.createElement('div');
  div.innerHTML='<b>'+d+'</b>';
  div.style.textAlign='center';
  cal.appendChild(div);
 });

 for(let i=0;i<firstDay;i++){
  cal.appendChild(document.createElement('div'));
 }

 for(let i=1;i<=days;i++){
  let date=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;

  let div=document.createElement('div');
  div.className='day';
  div.innerText=i;

  if(data[date]) div.style.background='#b6fcb6';

   // tap
let lastTap = 0;
let tapTimer;

div.addEventListener('click', () => {
  let now = new Date().getTime();
  let diff = now - lastTap;

  clearTimeout(tapTimer);

  if (diff < 300) {
    // ✅ DOUBLE TAP → EDIT
    window.location.href = `add.html?date=${date}`;
  } else {
    // ⏳ WAIT to confirm it's not double tap
    tapTimer = setTimeout(() => {
      // 👁 SINGLE TAP → SHOW DETAILS
      showDetails(date);
    }, 300);
  }

  lastTap = now;
});

  let timer;
  div.addEventListener('touchstart',()=>timer=setTimeout(()=>deleteShift(date),700));
  div.addEventListener('touchend',()=>clearTimeout(timer));

  cal.appendChild(div);
 }
}

// delete
function deleteShift(date){
 if(!data[date]) return;
 if(confirm('Delete shift?')){
  delete data[date];
  localStorage.setItem('shifts',JSON.stringify(data));
  renderChart();
  renderCalendar();
  document.getElementById('details').style.display='none';
 }
}

// details
function showDetails(date){
 let d=document.getElementById('details');

 if(data[date]){
  let s=data[date];
  d.style.display='block';
  d.innerHTML=`
    <h3>${date}</h3>
    From: ${s.from}<br>
    To: ${s.to}<br>
    Hours: ${s.hours.toFixed(2)}<br>
    Pay: $${s.pay.toFixed(2)}
  `;
 } else {
  d.style.display='block';
  d.innerHTML=`<h3>${date}</h3>No shift recorded`;
 }
}

renderChart();
renderCalendar();
</script>

</body>
</html>
