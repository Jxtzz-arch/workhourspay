<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f5f5f5}

/* 🔥 HAMBURGER */
.menu-btn{
  position:fixed;
  top:15px;
  left:15px;
  font-size:22px;
  background:white;
  border:none;
  border-radius:8px;
  padding:8px 12px;
  box-shadow:0 2px 5px rgba(0,0,0,0.2);
  z-index:1000;
}

/* 🔥 SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  left:-220px;
  width:200px;
  height:100%;
  background:white;
  box-shadow:2px 0 8px rgba(0,0,0,0.2);
  padding:20px;
  transition:0.3s;
  z-index:999;
}

.sidebar.open{
  left:0;
}

.sidebar button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#4CAF50;
  color:white;
}

/* overlay */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.3);
  display:none;
  z-index:998;
}

.overlay.show{
  display:block;
}

.container{max-width:600px;margin:auto;padding:10px;margin-top:50px}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1)
}

.chart-container{height:200px}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px
}

.day{
  padding:10px;
  text-align:center;
  background:white;
  border-radius:8px;
  cursor:pointer;
}

h3{text-align:center}
</style>
</head>

<body>

<!-- ☰ MENU BUTTON -->
<button class="menu-btn" onclick="toggleMenu()">☰</button>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h3>Menu</h3>
  <button onclick="location.href='add.html'">+ Add Shift</button>
  <button onclick="location.href='settings.html'">⚙ Settings</button>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="container">

<h3 id="weekLabel"></h3>

<div class="card">
<h2>Weekly Graph</h2>
<div class="chart-container">
<canvas id="chart"></canvas>
</div>
</div>

<div class="card">
<h2>Calendar</h2>
<div id="calendar" class="calendar"></div>
</div>

<div class="card" id="details" style="display:none;"></div>

</div>

<script>
let data = JSON.parse(localStorage.getItem('shifts')||'{}');
let offset = 0;
let chart;

/* 🔥 MENU TOGGLE */
function toggleMenu(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

// week calc
function getMonday(d){
 let date=new Date(d);
 let day=date.getDay();
 let diff=(day===0?-6:1-day);
 date.setDate(date.getDate()+diff+offset*7);
 return date;
}

// chart
function renderChart(){
 let monday=getMonday(new Date());
 let labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
 let hours=[],pay=[];

 for(let i=0;i<7;i++){
  let d=new Date(monday);
  d.setDate(monday.getDate()+i);
  let key=d.toISOString().split('T')[0];

  hours.push(data[key]?.hours||0);
  pay.push(data[key]?.pay||0);
 }

 document.getElementById('weekLabel').innerText=monday.toDateString();

 if(chart) chart.destroy();
 chart=new Chart(document.getElementById('chart'),{
  type:'bar',
  data:{labels,datasets:[{label:'Hours',data:hours},{label:'Pay ($)',data:pay}]},
  options:{responsive:true,maintainAspectRatio:false}
 });
}

// swipe
let startX=0;
document.addEventListener('touchstart',e=>startX=e.touches[0].clientX);
document.addEventListener('touchend',e=>{
 let diff=startX-e.changedTouches[0].clientX;
 if(Math.abs(diff)>50){
  if(diff>0){offset--;}
  else if(offset<0){offset++;}
  renderChart();
 }
});

// calendar
function renderCalendar(){
 let cal=document.getElementById('calendar');
 cal.innerHTML='';
 let today=new Date();
 let year=today.getFullYear();
 let month=today.getMonth();
 let days=new Date(year,month+1,0).getDate();

 for(let i=1;i<=days;i++){
  let date=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
  let div=document.createElement('div');
  div.className='day';
  div.innerText=i;

  if(data[date]) div.style.background='#b6fcb6';

  div.onclick=()=>showDetails(date);

  let timer;
  div.addEventListener('touchstart',()=>timer=setTimeout(()=>deleteShift(date),700));
  div.addEventListener('touchend',()=>clearTimeout(timer));

  cal.appendChild(div);
 }
}

// delete
function deleteShift(date){
 if(!data[date]) return;
 if(confirm('Delete shift?')){
  delete data[date];
  localStorage.setItem('shifts',JSON.stringify(data));
  renderChart();
  renderCalendar();
  document.getElementById('details').style.display='none';
 }
}

// details
function showDetails(date){
 let d=document.getElementById('details');

 if(data[date]){
  let s=data[date];
  d.style.display='block';
  d.innerHTML=`
    <h3>${date}</h3>
    From: ${s.from}<br>
    To: ${s.to}<br>
    Hours: ${s.hours.toFixed(2)}<br>
    Pay: $${s.pay.toFixed(2)}
  `;
 } else {
  d.style.display='block';
  d.innerHTML=`<h3>${date}</h3>No shift recorded`;
 }
}

renderChart();
renderCalendar();
</script>

</body>
</html>
